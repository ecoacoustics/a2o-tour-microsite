<section class="site-cards" aria-labelledby="site-cards-title">
    <h2 id="site-cards-title">Explore the field sites</h2>
    <div class="site-cards-grid">
        {{ range $site := site.Params.map.sites }}
            {{ $cardID := printf "site-card-%s" ($site.campaign | urlize) }}
            {{ partial "map/card.html" (dict
                "id" $cardID
                "site" $site
                "mode" "card"
            ) }}
        {{ end }}
    </div>
</section>
<script>
    document.querySelectorAll(".site-card").forEach((card) => {
        const audio = card.querySelector(".species-audio");
        const buttons = card.querySelectorAll(".species-item-play[data-audio-url]");

        const stopAudio = () => {
            audio.pause();
            audio.currentTime = 0;
            buttons.forEach((button) => {
                button.classList.remove("is-playing");
                button.querySelector("sl-icon").name = "volume-up";
                button.ariaLabel = button.dataset.playLabel;
            });
        };

        buttons.forEach((button) => {
            button.dataset.playLabel = button.ariaLabel;
            button.addEventListener("click", (event) => {
                event.preventDefault();
                if (button.classList.contains("is-playing")) {
                    stopAudio();
                    return;
                }

                stopAudio();
                audio.src = button.dataset.audioUrl;
                audio.play().then(() => {
                    button.classList.add("is-playing");
                    button.querySelector("sl-icon").name = "stop-fill";
                    button.ariaLabel = button.dataset.playLabel.replace("Play", "Stop");
                }).catch(() => {
                    button.ariaLabel = "Audio unavailable";
                });
            });
        });
        audio.addEventListener("ended", stopAudio);
    });
</script>
