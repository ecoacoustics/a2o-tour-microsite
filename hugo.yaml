              image: "images/species/Magpie-lark.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1672831/media.mp3?end_offset=705&start_offset=685"
      - campaign: "Monjebup Reserve"
        latitude: -34.243607
        longitude: 118.560849
        page: "/monjebup/"
        description: "Mallee and heathland in south-western Australia that shelters several threatened species."
        content:
          image: "images/sites/monjebup/monjebup.jpg"
          species:
            - name: "Western Whipbird"
              description: "A shy, olive-grey bird of dense mallee and heath that is far more often heard than seen, with pairs singing a duet of scratchy whistles."
              tag_ids: [27088]
              image: "images/species/Western-Whipbird.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/156490/media.mp3?end_offset=55&start_offset=35"
            - name: "Baudin's or Carnaby's Black Cockatoo"
              description: "Two endangered white-tailed black cockatoos of south-western Australia that look and sound alike, with wailing 'wy-lah' contact calls."
              tag_ids: [27660]
              image: "images/sites/monjebup/monjebup.jpg" # TODO: replace placeholder with species image
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/351141/media.mp3?end_offset=4345&start_offset=4325"
            - name: "Western Banjo Frog"
              description: "A large burrowing frog of the south-west whose single, resonant 'bonk' call sounds like a plucked banjo string."
              tag_ids: [27651]
              image: "images/species/Western-Banjo-Frog.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/157583/media.mp3?end_offset=2635&start_offset=2615"
            - name: "Western Whistler"
              description: "A robust whistler of south-western woodland and heath, closely related to the Golden Whistler, with a rich song that ends in a whip-crack."
              tag_ids: [26624]
              image: "images/species/Western-Whistler.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1217666/media.mp3?end_offset=5275&start_offset=5255"
            - name: "Weebill"
              description: "Australia's smallest bird, a pale, short-billed canopy forager that moves through eucalypts in busy groups with a loud, cheerful song."
              tag_ids: [26798]
              image: "images/species/Weebill.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/344871/media.mp3?end_offset=4825&start_offset=4805"
            - name: "Stubble Quail"
              description: "A cryptic, ground-dwelling quail of grassland and crops, usually detected by its far-carrying, repeated whistled call."
              tag_ids: [26809]
              image: "images/species/Stubble-Quail.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/344510/media.mp3?end_offset=7135&start_offset=7115"
            - name: "Red Wattlebird"
              description: "A large, noisy honeyeater with red wattles on its cheeks that feeds on nectar and gives harsh, coughing calls."
              tag_ids: [26745]
              image: "images/species/Red-Wattlebird.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1216258/media.mp3?end_offset=3625&start_offset=3605"
            - name: "Grey Fantail"
              description: "A restless little flycatcher that fans its tail as it darts after insects and sings a sweet, high-pitched, tumbling song."
              tag_ids: [26625]
              image: "images/species/Grey-Fantail.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/162074/media.mp3?end_offset=385&start_offset=365"
            - name: "Australian Magpie"
              description: "A familiar black-and-white songbird of open country, famous for its rich, flute-like carolling at dawn."
              tag_ids: [26676]
              image: "images/species/Australian-Magpie.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/342276/media.mp3?end_offset=5095&start_offset=5075"
      - campaign: "Marshmead"
        latitude: -37.486020
        longitude: 149.831509
        page: "/marshmead/"
        description: "Tall coastal forest in far East Gippsland, rich with nocturnal and forest-dwelling species."
        content:
          image: "images/sites/marshmead/marshmead.jpg"
          species:
            - name: "Superb Lyrebird"
              description: "A large ground-dwelling songbird famous for its elaborate song, which mimics many other forest species."
              tag_ids: [26747]
              image: "images/species/Superb-Lyrebird.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1209384/media.mp3?end_offset=4975&start_offset=4955"
            - name: "Yellow-bellied Glider"
              description: "A nocturnal glider of tall eucalypt forest that feeds on sap and nectar and is known for its loud, gurgling shrieks."
              tag_ids: [27663]
              image: "images/species/yellow-bellied-glider.jpeg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1209740/media.mp3?end_offset=7165&start_offset=7145"
            - name: "Gang-gang Cockatoo"
              description: "An endangered small grey cockatoo, the males with a scarlet head and wispy crest, whose call sounds like a creaking gate."
              tag_ids: [27049]
              image: "images/species/Gang-gang-Cockatoo.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1214136/media.mp3?end_offset=2395&start_offset=2375"
            - name: "Southern Brown Tree Frog"
              description: "A small brown tree frog of south-eastern Australia that calls through the cooler months with a long series of rising 'creee' notes."
              tag_ids: [27653]
              image: "images/species/Southern-Brown-Tree-Frog.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1213850/media.mp3?end_offset=2665&start_offset=2645"
            - name: "Yellow-tailed Black-Cockatoo"
              description: "A large black cockatoo with yellow cheek and tail panels that feeds on seeds and wood-boring grubs and gives a far-carrying, wailing call."
              tag_ids: [27654]
              image: "images/species/Yellow-tailed-Black-Cockatoo.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1214877/media.mp3?end_offset=5485&start_offset=5465"
            - name: "Bell Miner"
              description: "A colonial green honeyeater whose constant, tinkling bell-like calls ring through the forest understorey."
              tag_ids: [26757]
              image: "images/species/Bell-Miner.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1208936/media.mp3?end_offset=6985&start_offset=6965"
            - name: "Wonga Pigeon"
              description: "A plump grey-and-white pigeon of the forest floor that repeats a loud, monotonous call for long periods."
              tag_ids: [27051]
              image: "images/species/Wonga-Pigeon.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1209912/media.mp3?end_offset=3715&start_offset=3695"
            - name: "Common Eastern Froglet"
              description: "A tiny ground frog of damp places across south-eastern Australia whose chirping 'crick-crick-crick' can be heard almost year-round."
              tag_ids: [27652]
              image: "images/species/Common-Eastern-Froglet.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1214232/media.mp3?end_offset=895&start_offset=875"
            - name: "Pied Currawong"
              description: "A large black-and-white bird with piercing yellow eyes that gives loud, ringing 'curra-wong' calls through the forest."
              tag_ids: [26699]
              image: "images/species/Pied-Currawong.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1208548/media.mp3?end_offset=5335&start_offset=5315"
      - campaign: "Binya"
        latitude: -34.219819
        longitude: 146.267081
        page: "/binya/"
        description: "Dry inland woodland in the Riverina of New South Wales."
        content:
          image: "images/sites/binya/binya.jpg"
          species:
            - name: "Painted Honeyeater"
              description: "A nomadic black-and-white honeyeater with yellow wing edges that specialises in mistletoe fruit."
              tag_ids: [27330]
              image: "images/species/Painted-Honeyeater.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1452067/media.mp3?end_offset=745&start_offset=725"
            - name: "Tawny Frogmouth"
              description: "A nocturnal, owl-like bird that roosts by day disguised as a broken branch and gives a low, repeated 'oom' call at night."
              tag_ids: [26642]
              image: "images/species/Tawny-Frogmouth.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/667535/media.mp3?end_offset=1345&start_offset=1325"
            - name: "Peron's Tree Frog"
              description: "A climbing tree frog with emerald flecks and cross-shaped pupils whose call is a long, cackling laugh."
              tag_ids: [27649]
              image: "images/species/Perons-Tree-Frog.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/676597/media.mp3?end_offset=3925&start_offset=3905"
            - name: "Red-capped Robin"
              description: "A small dry-woodland robin; males have a bright red cap and breast and sing a rapid, insect-like trill."
              tag_ids: [26769]
              image: "images/species/Red-capped-Robin.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1243187/media.mp3?end_offset=685&start_offset=665"
            - name: "Spotted Marsh Frog"
              description: "A spotted ground frog of inland swamps, dams and flooded paddocks whose call is a rapid, knocking 'uk-uk-uk'."
              tag_ids: [27657]
              image: "images/species/Spotted-Marsh-Frog.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/672530/media.mp3?end_offset=1375&start_offset=1355"
            - name: "Horsfield's Bronze Cuckoo"
              description: "A small bronze-green cuckoo that lays its eggs in other birds' nests and gives a descending, whistled call."
              tag_ids: [27647]
              image: "images/species/Horsfields-Bronze-Cuckoo.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1240530/media.mp3?end_offset=4375&start_offset=4355"
            - name: "Rufous Whistler"
              description: "A woodland songbird whose males have a rufous belly and black breast band and sing loud, ringing phrases through spring and summer."
              tag_ids: [26665]
              image: "images/species/Rufous-Whistler.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/684979/media.mp3?end_offset=3445&start_offset=3425"
            - name: "Plains Froglet"
              description: "A tiny froglet of inland floodplains and grassy wetlands that calls with short, high-pitched beeps from flooded ground."
              tag_ids: [27659]
              image: "images/species/Plains-Froglet.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/670677/media.mp3?end_offset=4885&start_offset=4865"
            - name: "Striped Honeyeater"
              description: "A streaky grey-and-white honeyeater of inland woodland that builds a hanging nest and sings rich, rollicking phrases."
              tag_ids: [26956]
              image: "images/species/Striped-Honeyeater.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/670669/media.mp3?end_offset=5275&start_offset=5255"
  style:
    xsmallBreakPoint: 425px
    smallBreakPoint: 768px
    mediumBreakPoint: 1024px
    largeBreakPoint: 1200px
    roundedButtons: true
    # A2O theme color: #304f3b
    themeColor:
      hue: 141.29deg
      saturation: 24.41%
      lightness: 24.90%
    # Keep 600 as the unaltered theme color; tint lighter steps and shade darker steps.
    themeShades:
      "50": color-mix(in srgb, var(--sl-color-primary-600) 3%, white)
      "100": color-mix(in srgb, var(--sl-color-primary-600) 8%, white)
      "200": color-mix(in srgb, var(--sl-color-primary-600) 18%, white)
      "300": color-mix(in srgb, var(--sl-color-primary-600) 35%, white)
      "400": color-mix(in srgb, var(--sl-color-primary-600) 55%, white)
      "500": color-mix(in srgb, var(--sl-color-primary-600) 78%, white)
      "600": "#304f3b"
      "700": color-mix(in srgb, var(--sl-color-primary-600) 85%, black)
      "800": color-mix(in srgb, var(--sl-color-primary-600) 70%, black)
      "900": color-mix(in srgb, var(--sl-color-primary-600) 55%, black)
      "950": color-mix(in srgb, var(--sl-color-primary-600) 35%, black)
