  map:
    min_zoom: 3
    sites:
      - campaign: "Daintree Rainforest"
        latitude: -16.103236
        longitude: 145.452491
        page: "/daintree/"
        description: "The oldest rainforest in the world, listed as a UNESCO Heritage Site."
        content:
          image: "images/sites/daintree/daintree.jpg"
          species:
            - name: "Victoria's Riflebird"
              description: "Iconic rainforest bird-of-paradise. Voice is not as showy as its plumage."
              tag_ids: [27219]
              image: "images/species/Victorias-Riflebird.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/492310/media.mp3?end_offset=2665&start_offset=2645"
            - name: "Buff-breasted Paradise-Kingfisher"
              description: "A bright, long-tailed kingfisher that breeds in North Queensland rainforests and migrates to New Guinea for the winter."
              tag_ids: [27014]
              image: "images/species/Buff-breasted-Paradise-Kingfisher.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/491051/media.mp3?end_offset=1585&start_offset=1565"
            - name: "Wompoo Fruit Dove"
              description: "A large fruit dove that feeds quietly in the canopy. Known for its 'Wompoo!' call."
              tag_ids: [27144]
              image: "images/species/Wompoo-Fruit-Dove.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/492563/media.mp3?end_offset=5875&start_offset=5855"
            - name: "Orange-footed Scrubfowl"
              description: "A dark, chicken-sized mound-builder that incubates its eggs in huge heaps of soil and leaf litter and gives loud, gurgling cackles, often at night."
              tag_ids: [27107]
              image: "images/species/Orange-footed-Scrubfowl.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/488324/media.mp3?end_offset=2815&start_offset=2795"
            - name: "Spotted Catbird"
              description: "A large rainforest species with highly unusual cat-like calls."
              tag_ids: [27125]
              image: "images/species/Spotted-Catbird.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/490212/media.mp3?end_offset=565&start_offset=545"
            - name: "Sulphur-crested Cockatoo"
              description: "A large white cockatoo with a yellow crest that gathers in noisy flocks and gives harsh, far-carrying screeches."
              tag_ids: [26681]
              image: "images/species/Sulphur-crested-Cockatoo.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1877393/media.mp3?end_offset=5515&start_offset=5495"
      - campaign: "Mount Barney"
        latitude: -28.234639
        longitude: 152.641407
        page: "/mount-barney/"
        description: "South-east Queensland's most well-known mountain."
        content:
          image: "images/sites/mtbarney/mtbarney.jpg"
          species:
            - name: "Koala"
              description: "A mostly nocturnal, tree-dwelling marsupial that rests for long periods, feeds on eucalypt leaves, and communicates with deep bellows."
              tag_ids: [113]
              image: "images/species/Koala.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/508757/media.mp3?end_offset=55&start_offset=35"
            - name: "Glossy-black Cockatoo"
              description: "A dark, quiet cockatoo that specialises in she-oak seeds, with males showing red tail panels and females yellow markings."
              tag_ids: [26967]
              image: "images/species/Glossy-black-Cockatoo.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1421163/media.mp3?end_offset=4645&start_offset=4625"
            - name: "Great Barred Frog"
              description: "A large, dark-barred frog of rainforest and wet forest streams whose deep, guttural 'wark' calls carry along creek lines at night."
              tag_ids: [27662]
              image: "images/sites/mtbarney/mtbarney.jpg" # TODO: replace placeholder with species image
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1872603/media.mp3?end_offset=3055&start_offset=3035"
            - name: "Spotted Quail-thrush"
              description: "A cryptic, ground-dwelling bird of dry forest that forages through leaf litter and is more often heard than seen."
              tag_ids: [26811]
              image: "images/species/Spotted-Quail-thrush.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1417075/media.mp3?end_offset=4435&start_offset=4415"
            - name: "Sugar Glider"
              description: "A small nocturnal glider that sails between trees on furry membranes, feeds on sap and nectar, and gives yapping calls."
              tag_ids: [27658]
              image: "images/species/sugar-glider.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1873028/media.mp3?end_offset=4675&start_offset=4655"
            - name: "White-throated Nightjar"
              description: "A nocturnal aerial hunter with mottled camouflage and a white throat patch, known for a bubbling song at dusk and dawn."
              tag_ids: [26648]
              image: "images/species/White-throated-Nightjar.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/511298/media.mp3?end_offset=5095&start_offset=5075"
            - name: "Scarlet Myzomela"
              description: "A tiny honeyeater whose bright-red males visit flowering trees for nectar and insects and sing a tuneful, tinkling song."
              tag_ids: [26631]
              image: "images/species/Scarlet-Myzomela.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1420677/media.mp3?end_offset=4135&start_offset=4115"
            - name: "Southern Boobook"
              description: "Australia's smallest and most widespread owl, best known for its familiar two-note 'boo-book' call at night."
              tag_ids: [103]
              image: "images/species/Southern-Boobook.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1412817/media.mp3?end_offset=1225&start_offset=1205"
            - name: "Grey Shrike-thrush"
              description: "A plain grey songbird of forest and woodland with one of the richest, most melodious songs in the bush."
              tag_ids: [26639]
              image: "images/species/Grey-Shrike-thrush.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1420901/media.mp3?end_offset=3445&start_offset=3425"
      - campaign: "Bowra Station"
        latitude: -27.981830
        longitude: 145.611615
        page: "/bowra/"
        description: "An inland Queensland soundscape near Cunnamulla, a haven for birdwatchers."
        content:
          image: "images/sites/bowra/bowra.jpg"
          species:
            - name: "Pink Cockatoo"
              description: "A striking white-and-pink cockatoo with a raised red-and-yellow crest that usually travels in pairs or small groups."
              tag_ids: [27646]
              image: "images/species/Pink-Cockatoo.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1540597/media.mp3?end_offset=145&start_offset=125"
            - name: "Budgerigar"
              description: "A small green-and-yellow parrot that travels in nomadic flocks, feeds on grass seeds, and gives frequent chattering contact calls."
              tag_ids: [26721]
              image: "images/species/Budgerigar.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/457814/media.mp3?end_offset=445&start_offset=425"
            - name: "Red Tree Frog"
              description: "A small, reddish-brown tree frog of inland and northern Australia that gathers at temporary pools after rain and calls with a long, buzzing 'waaa'."
              tag_ids: [27655]
              image: "images/sites/bowra/bowra.jpg" # TODO: replace placeholder with species image
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1681043/media.mp3?end_offset=1165&start_offset=1145"
            - name: "Rainbow Bee-eater"
              description: "A slender, brilliantly coloured bird that catches bees and dragonflies on the wing and gives a constant, rolling 'prrrp' call."
              tag_ids: [26672]
              image: "images/species/Rainbow-Bee-eater.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1406327/media.mp3?end_offset=3505&start_offset=3485"
            - name: "Spotted Nightjar"
              description: "A heavily mottled, ground-roosting nightjar that hunts flying insects after dark and calls with an ascending series of notes."
              tag_ids: [26768]
              image: "images/species/Spotted-Nightjar.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/7315/media.mp3?end_offset=6125&start_offset=6105"
            - name: "Crested Bellbird"
              description: "A grey woodland bird with a black crest and breast whose bell-like call carries across open scrub."
              tag_ids: [26679]
              image: "images/species/Crested-Bellbird.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/1406387/media.mp3?end_offset=45295&start_offset=45275"
            - name: "Cockatiel"
              description: "A nomadic cockatoo with an expressive crest and long tail that moves between water and seed-rich country in pairs or flocks."
              tag_ids: [26865]
              image: "images/species/Cockatiel.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/7213/media.mp3?end_offset=4165&start_offset=4145"
            - name: "Brown Treecreeper"
              description: "A social treecreeper that spirals up rough trunks and probes bark and leaf litter for insects in small groups."
              tag_ids: [26707]
              image: "images/species/Brown-Treecreeper.jpg"
              examples:
                - url: "https://api.acousticobservatory.org/audio_recordings/7213/media.mp3?end_offset=4195&start_offset=4175"
            - name: "Magpie-lark"
              description: "A familiar black-and-white bird of open country that builds mud nests and is known for its piping 'pee-o-wit' duets."
